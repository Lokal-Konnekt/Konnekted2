name: Android beta APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-beta
  cancel-in-progress: true

jobs:
  build:
    name: Build beta APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter dependencies
        run: |
          # integration_test is only used by host-side tests. Keeping it out
          # of the beta package prevents Flutter from registering its Android
          # plugin in an APK classpath where that plugin is unavailable.
          sed -i '/^  integration_test:$/,+1d' pubspec.yaml
          flutter pub get

      - name: Build arm64 beta APK
        run: flutter build apk --debug --flavor full --target-platform android-arm64 --no-pub

      - uses: actions/upload-artifact@v4
        with:
          name: konnekted-beta-arm64
          path: build/app/outputs/flutter-apk/app-full-debug.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish beta release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: konnekted-beta-arm64
          path: beta
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          gh release create "beta-${RUN_NUMBER}-${RUN_ATTEMPT}" beta/*.apk \
            --target "$COMMIT" --title "Android beta ${RUN_NUMBER}" \
            --prerelease --latest=false \
            --notes "ARM64 Android beta for testing. Debug-signed APK; not a production release."
