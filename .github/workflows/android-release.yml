name: Android release

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Distribution flavor (each APK includes arm64 and armv7)
        type: choice
        options: [full, play, both]
        default: both
      build_number:
        description: 'Optional positive versionCode; default: pubspec build + workflow run number'
        type: string
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

# Signing/publication is serialized. Re-runs retain the original versionCode.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Lokal-Konnekt/Konnekted2'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      flavors: ${{ steps.metadata.outputs.flavors }}
      version: ${{ steps.metadata.outputs.version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit reachable from trusted main
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Manual releases must run from main.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Validate semantic tag and deterministic version metadata
        id: metadata
        env:
          RELEASE_FLAVOR: ${{ inputs.flavor || 'both' }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 tool/ci_release.py metadata

  checks:
    needs: prepare
    uses: ./.github/workflows/android-ci.yml

  signed-apks:
    name: Signed ${{ matrix.flavor }} APK
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.prepare.outputs.flavors) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail explicitly if release signing secrets are missing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/ci_release.py check-signing
      - uses: ./.github/actions/android-toolchain
      - name: Build and verify signed source-native APK
        env:
          RELEASE_FLAVOR: ${{ matrix.flavor }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/ci_release.py build
      - name: Remove temporary signing material
        if: always()
        run: python3 tool/ci_release.py cleanup
      - name: Check dependency locks remained unchanged
        run: git diff --exit-code -- pubspec.lock rust/Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ matrix.flavor }}-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build_number }}
          path: ${{ runner.temp }}/konnekted-release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish trusted tag
    needs: [prepare, signed-apks]
    if: >-
      github.repository == 'Lokal-Konnekt/Konnekted2' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # This job does not check out or execute repository code.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: android-*-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build_number }}
          path: release
          merge-multiple: true
      - name: Verify checksums and publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        working-directory: release
        run: |
          cat SHA256SUMS-*.txt > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" ./*.apk SHA256SUMS ./*-metadata.json \
            --verify-tag --title "$RELEASE_TAG" --generate-notes --latest=false "${flags[@]}"
