name: Signed Android APKs (shared)
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      flavors:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    name: Signed ${{ matrix.flavor }} APK
    if: github.repository == 'Lokal-Konnekt/lokal-mobile'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(inputs.flavors) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require trusted main history
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Require the permanent signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/ci_release.py check-signing

      - name: Prepare pinned Discord Social SDK
        env:
          LOKAL_DISCORD_SDK_PASSPHRASE: ${{ secrets.LOKAL_DISCORD_SDK_PASSPHRASE }}
        run: python3 tool/prepare_discord_sdk.py

      - uses: ./.github/actions/android-toolchain
        with:
          cache: 'true'

      - name: Restore compiled Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Cargokit still invokes cargo build --locked for both ARM targets.
          # Cargo fingerprints determine which crates must be rebuilt.
          path: |
            build/rust_lib_flick_player/build/aarch64-linux-android
            build/rust_lib_flick_player/build/armv7-linux-androideabi
            build/rust_lib_flick_player/build/release
          key: beta-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml', 'rust/cargokit.yaml', 'rust_builder/cargokit/**', '.github/actions/android-toolchain/action.yml', 'tool/ci_android.py', 'android/app/build.gradle.kts') }}-${{ hashFiles('rust/**') }}
          restore-keys: |
            beta-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml', 'rust/cargokit.yaml', 'rust_builder/cargokit/**', '.github/actions/android-toolchain/action.yml', 'tool/ci_android.py', 'android/app/build.gradle.kts') }}-

      - name: Build and verify the signed APK
        env:
          RELEASE_FLAVOR: ${{ matrix.flavor }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Uses the same key and application ID as other sideloaded releases.
        # A runner-generated debug key must never be used for published betas.
        run: python3 tool/ci_release.py build

      # Smoke-test the exact published APK on a clean Android 8 install.
      # GitHub runners need hardware acceleration; fail fast rather than
      # hanging at 'adb wait-for-device' for the entire job timeout.
      - name: Smoke-test fresh install on Android 8.0
        if: matrix.flavor == 'full'
        timeout-minutes: 8
        shell: bash
        env:
          APK_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          if [ ! -e /dev/kvm ]; then
            echo "::error::Runner has no /dev/kvm; refusing a slow software-emulated Android boot."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          sdkmanager --install "system-images;android-26;google_apis;x86_64" "emulator" >/dev/null
          echo no | avdmanager create avd -n lokal-fresh-install -k "system-images;android-26;google_apis;x86_64" --force
          emulator -avd lokal-fresh-install -no-window -no-audio -no-boot-anim -no-snapshot -accel on -gpu swiftshader_indirect >"$RUNNER_TEMP/lokal-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'adb emu kill >/dev/null 2>&1 || true; kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT
          # Never wait indefinitely if the emulator crashes or cannot boot.
          for attempt in $(seq 1 45); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "::error::Emulator exited before Android booted."
              tail -n 100 "$RUNNER_TEMP/lokal-emulator.log" || true
              exit 1
            fi
            if adb devices | grep -Eq '^emulator-[0-9]+[[:space:]]+device &&
               [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              echo "::error::Emulator did not boot within 135 seconds."
              adb devices -l || true
              tail -n 100 "$RUNNER_TEMP/lokal-emulator.log" || true
              exit 1
            fi
            sleep 3
          done
          test -z "$(adb shell pm list packages com.lokalkonnekt.konnekted2 | tr -d '\r')"
          timeout 90 adb install -r "$RUNNER_TEMP/konnekted-release/Lokal-$APK_VERSION-universal.apk"
          adb shell pm path com.lokalkonnekt.konnekted2 | grep -q package:

      - name: Remove temporary signing material
        if: always()
        run: python3 tool/ci_release.py cleanup

      - name: Verify dependency locks
        run: git diff --exit-code -- pubspec.lock rust/Cargo.lock

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ matrix.flavor }}-${{ inputs.build_number }}
          path: ${{ runner.temp }}/konnekted-release/*
          if-no-files-found: error
          retention-days: 7
 &&
               [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              echo "::error::Emulator did not boot within 135 seconds."
              adb devices -l || true
              tail -n 100 "$RUNNER_TEMP/lokal-emulator.log" || true
              exit 1
            fi
            sleep 3
          done
          test -z "$(adb shell pm list packages com.lokalkonnekt.konnekted2 | tr -d '\r')"
          timeout 90 adb install -r "$RUNNER_TEMP/konnekted-release/Lokal-$APK_VERSION-universal.apk"
          adb shell pm path com.lokalkonnekt.konnekted2 | grep -q package:

      - name: Remove temporary signing material
        if: always()
        run: python3 tool/ci_release.py cleanup

      - name: Verify dependency locks
        run: git diff --exit-code -- pubspec.lock rust/Cargo.lock

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ matrix.flavor }}-${{ inputs.build_number }}
          path: ${{ runner.temp }}/konnekted-release/*
          if-no-files-found: error
          retention-days: 7
