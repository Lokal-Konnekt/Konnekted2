# Branding is generated by tool/gen_lokal_launcher_icons.py, including per-accent
# Android launcher aliases. Do not use this tool instead of the generator.
flutter_launcher_icons:
  image_path: "assets/branding/lokal_icon.png"
  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/branding/lokal_icon.png"
  adaptive_icon_foreground_inset: 18
  adaptive_icon_monochrome: "assets/branding/lokal_icon_sticker.png"
