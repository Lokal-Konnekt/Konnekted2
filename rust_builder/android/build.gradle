// The Android Gradle Plugin builds the native code with the Android NDK.

plugins {
    // Version comes from the host settings, matching the application plugin.
    id 'com.android.library'
}

group 'com.flutter_rust_bridge.rust_lib_flick_player'
version '1.0'

// repositories are handled by the root project in Flutter projects.

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.rust_lib_flick_player'
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 21  // cpal/oboe requires API 21+
        
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }
    
    // Ensure C++ shared library is packaged
    packagingOptions {
        pickFirst '**/libc++_shared.so'
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../rust"
    libname = "rust_lib_flick_player"
}
